<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruta fresca Madrid</title>
<meta name="description" content="El camino con más sombra y menos riesgo para ir a pie por Madrid, calle a calle y hora a hora.">
<meta name="theme-color" content="#13302a">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/*LEAFLET_CSS*/</style>
<style>
/* La ciudad dibujada solo por su sombra a la hora elegida (sin mapa base). Panel a la izquierda, mapa a la derecha; en móvil, mapa arriba.
   Escala de sol (naranja) a sombra (azul): se distingue también con daltonismo. Las calles se cargan por cuadrículas al acercarse. */
:root{
  --paper:#e8eeeb; --panel:#fbfcfb; --ink:#13302a; --muted:#53675f; --line:#d2dcd7; --accent:#1f5f98;
  --s0:#cf5a26; --s1:#eba15f; --s2:#bfae7d; --s3:#6aaad3; --s4:#235f98;
  --route:#7d2b8f; --short:#13302a; --pit:#2f7d3a; --rest:#24302c; --cold:#1f8fb3; --atr:#a3162f; --map-bg:#e2e8e5;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1916; --panel:#14211d; --ink:#e3ece8; --muted:#9db1aa; --line:#2a3a35; --accent:#7fbbe6;
    --s0:#ff7f45; --s1:#f2b072; --s2:#d6c9a2; --s3:#7fbbe6; --s4:#4f93e6;
    --route:#d99be8; --short:#e3ece8; --pit:#7fd98c; --rest:#e3ece8; --cold:#5fd0f0; --atr:#ff6f86; --map-bg:#0b1311; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1916; --panel:#14211d; --ink:#e3ece8; --muted:#9db1aa; --line:#2a3a35; --accent:#7fbbe6;
  --s0:#ff7f45; --s1:#f2b072; --s2:#d6c9a2; --s3:#7fbbe6; --s4:#4f93e6;
  --route:#d99be8; --short:#e3ece8; --pit:#7fd98c; --rest:#e3ece8; --cold:#5fd0f0; --atr:#ff6f86; --map-bg:#0b1311; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:minmax(340px,420px) 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:20px 20px 24px}
#map{position:relative;height:100%;background:var(--map-bg)}
.brand h1{font:800 34px/1 var(--display);letter-spacing:-.02em;margin:0}
.brand h1 span{background:linear-gradient(90deg,var(--s0),var(--s2) 50%,var(--s4));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.seg{display:grid;gap:4px;background:var(--paper);padding:4px;border-radius:10px}
.seg button{font:600 13px/1.2 var(--body);border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:7px;cursor:pointer}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.tabs{grid-template-columns:repeat(3,1fr)}
.tabs button{padding:9px 4px}
.hours{grid-template-columns:repeat(6,1fr)}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.ctrl{display:flex;flex-direction:column;gap:6px}
.ctrl .lbl{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.ctrl .lbl span{font-weight:500;color:var(--muted)}
.ctrlrow{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mode{display:flex;flex-direction:column;gap:12px}
.help{margin:0;color:var(--muted);font-size:14px;max-width:65ch}
label.field{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px}
.field input,.addr input{font:15px var(--body);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:0;width:100%}
.addr{display:grid;grid-template-columns:1fr 70px auto;gap:6px;align-items:end}
.addr .num input{text-align:center}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.headline{font:700 19px/1.25 var(--display);margin:0;text-wrap:balance}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border-radius:10px;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:3px}
.opt h3{margin:0;font:600 11.5px/1.2 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px}
.opt .big{font:700 28px/1.05 var(--display)}
.opt .sub{font-size:13px;color:var(--muted)}
.opt .safe{font-size:12.5px;color:var(--ink);border-top:1px solid var(--line);padding-top:5px;margin-top:3px}
.opt .safe b{color:var(--atr)}
.swatch{display:inline-block;width:14px;height:4px;border-radius:2px;flex:none;background:var(--route)}
.swatch.dash{background:repeating-linear-gradient(90deg,var(--short) 0 3px,transparent 3px 6px)}
.bar{height:6px;border-radius:3px;background:var(--s0);overflow:hidden;margin:3px 0 1px}
.bar i{display:block;height:100%;background:var(--s4)}
details.steps{border-top:1px solid var(--line);padding-top:8px}
details.steps summary{cursor:pointer;font-weight:600;font-size:13.5px}
details.steps ol{margin:8px 0 0;padding-left:20px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
details.steps ol span{color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--paper);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:700 26px/1.1 var(--display)}
.kpi span{font-size:12.5px;color:var(--muted)}
h2{font:700 16px/1.25 var(--display);margin:0}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 4px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;color:inherit;font:inherit}
.row:hover{background:var(--paper)}
.row .nm{font-weight:600;font-size:14px}
.row .meta{font-size:12.5px;color:var(--muted);grid-column:1}
.row .pct{grid-row:1 / span 2;grid-column:2;align-self:center;font:700 18px/1 var(--display)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:5px;vertical-align:1px}
.pill.baja{background:color-mix(in srgb,var(--s0) 20%,transparent);color:color-mix(in srgb,var(--s0) 75%,var(--ink))}
.toggles{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.legend{display:flex;flex-direction:column;gap:6px}
.legend .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.legend .scale i{height:8px;border-radius:2px}
.legend .labels{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;font-size:11.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:0;max-width:65ch}
.note a,.more a{color:var(--accent)}
.more{font-size:14px;font-weight:600;margin:0}
.btn{font:600 13.5px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;align-self:flex-start;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.stops{font-size:13.5px;display:flex;gap:6px 14px;flex-wrap:wrap}
.stops span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rest);margin-right:6px;vertical-align:1px}
.msg{font-size:13px;color:var(--muted);margin:0;min-height:1em}
.hidden{display:none !important}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font:600 15px var(--body);pointer-events:none;z-index:500}
.busy{position:absolute;top:10px;right:10px;z-index:900;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:600 12.5px var(--body);pointer-events:none}
.zoomhint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:850;background:color-mix(in srgb,var(--panel) 92%,transparent);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:600 12.5px var(--body);pointer-events:none;white-space:nowrap}
.leaflet-container{background:var(--map-bg);font:13px/1.4 var(--body)}
.leaflet-tooltip{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 4px rgb(0 0 0 / .18);font:600 12.5px/1.3 var(--body);padding:4px 8px}
.leaflet-tooltip-top:before{border-top-color:var(--panel)}
.leaflet-tooltip-bottom:before{border-bottom-color:var(--panel)}
.leaflet-tooltip-left:before{border-left-color:var(--panel)}
.leaflet-tooltip-right:before{border-right-color:var(--panel)}
.leaflet-tooltip.tag{font-weight:700}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}
.leaflet-popup-content{margin:12px 16px;font-size:13.5px;line-height:1.45}
.leaflet-popup-content b{font-family:var(--display)}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent) !important;color:var(--muted) !important}
.leaflet-control-attribution a{color:var(--accent) !important}
.leaflet-bar a{background:var(--panel) !important;color:var(--ink) !important;border-color:var(--line) !important}
@media (max-width:760px){
  .app{grid-template-columns:1fr;height:auto;min-height:100%}
  #map{height:56vh;order:-1}
  aside{border-right:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="app">
  <aside id="panel">
    <div class="brand"><h1><span>Ruta fresca</span></h1><p data-t="subtitle"></p></div>

    <div class="seg tabs" role="tablist" data-t-aria="modeAria">
      <button id="tab-cole" role="tab" aria-selected="true" aria-controls="mode-cole" data-mode="cole" type="button" data-t="tabCole"></button>
      <button id="tab-lento" role="tab" aria-selected="false" aria-controls="mode-lento" data-mode="lento" type="button" data-t="tabLento"></button>
      <button id="tab-ayto" role="tab" aria-selected="false" aria-controls="mode-ayto" data-mode="ayto" type="button" data-t="tabAyto"></button>
    </div>

    <div class="ctrlrow">
      <div class="ctrl"><div class="lbl" data-t="dayLabel"></div><div class="seg two" id="dates" role="group"></div></div>
      <div class="ctrl"><div class="lbl" data-t="prioLabel"></div><div class="seg three" id="prio" role="group"></div></div>
    </div>
    <div class="ctrl">
      <div class="lbl"><span data-t="hourLabel" style="color:var(--ink);font-weight:600"></span><span id="hour-sun"></span></div>
      <div class="seg hours" id="hours" role="group"></div>
    </div>

    <section id="mode-cole" class="mode" role="tabpanel" aria-labelledby="tab-cole">
      <p class="help" data-t="helpCole"></p>
      <label class="field"><span data-t="schoolField"></span>
        <input id="school-input" list="school-list" autocomplete="off" data-t-ph="schoolPh">
      </label>
      <div class="field"><span style="font-weight:600;font-size:13px" data-t="fromCole"></span>
        <div class="addr">
          <input id="street-cole" list="street-list" autocomplete="off" data-t-ph="streetPh" data-t-aria="streetAria">
          <span class="num"><input id="num-cole" inputmode="numeric" autocomplete="off" data-t-ph="numPh" data-t-aria="numAria"></span>
          <button class="btn here" type="button" data-for="cole" data-t="here"></button>
        </div>
        <p class="msg" id="msg-cole" aria-live="polite"></p>
      </div>
      <div class="card" id="cole-result" aria-live="polite"></div>
    </section>

    <section id="mode-lento" class="mode hidden" role="tabpanel" aria-labelledby="tab-lento">
      <p class="help" data-t="helpLento"></p>
      <div class="field"><span style="font-weight:600;font-size:13px" data-t="fromLento"></span>
        <div class="addr">
          <input id="street-lento" list="street-list" autocomplete="off" data-t-ph="streetPh" data-t-aria="streetAria">
          <span class="num"><input id="num-lento" inputmode="numeric" autocomplete="off" data-t-ph="numPh" data-t-aria="numAria"></span>
          <button class="btn here" type="button" data-for="lento" data-t="here"></button>
        </div>
        <p class="msg" id="msg-lento" aria-live="polite"></p>
      </div>
      <label class="field"><span data-t="toMayores"></span>
        <input id="mayores-input" list="mayores-list" autocomplete="off" data-t-ph="mayoresPh">
      </label>
      <div class="card" id="lento-result" aria-live="polite"></div>
      <button class="btn" id="lento-reset" type="button" data-t="reset"></button>
    </section>

    <section id="mode-ayto" class="mode hidden" role="tabpanel" aria-labelledby="tab-ayto">
      <div class="kpis" id="kpis"></div>
      <p class="help" id="ayto-lead"></p>
      <div class="toggles">
        <label><input type="checkbox" id="t-atr"> <span data-t="tAtr"></span></label>
        <label><input type="checkbox" id="t-fuentes"> <span data-t="tFuentes"></span></label>
      </div>
      <h2 data-t="hPlant"></h2>
      <div class="seg three" id="plant-seg" role="group" data-t-aria="plantAria"></div>
      <p class="help" id="plant-help" aria-live="polite"></p>
      <div id="plant-gain" class="hidden">
        <h2 data-t="hGain"></h2>
        <p class="help" data-t="helpGain"></p>
        <div class="list" id="gain-list"></div>
      </div>
      <h2 data-t="hPrio"></h2>
      <p class="help" id="prio-help"></p>
      <div class="list" id="prio-list"></div>
      <button class="btn hidden" id="prio-more" type="button"></button>
      <h2 data-t="hDis"></h2>
      <p class="help" id="dis-help"></p>
      <div class="list" id="dis-list"></div>
    </section>

    <div class="legend" aria-label="Leyenda">
      <h2 id="legend-title"></h2>
      <div class="scale"><i style="background:var(--s0)"></i><i style="background:var(--s1)"></i><i style="background:var(--s2)"></i><i style="background:var(--s3)"></i><i style="background:var(--s4)"></i></div>
      <div class="labels"><span data-t="sun"></span><span>1–25 %</span><span>26–50 %</span><span>51–75 %</span><span>+75 %</span></div>
    </div>
    <p class="more"><a href="metodo.html" data-t="methodLink"></a></p>
    <p class="note" id="note"></p>
  </aside>
  <div id="map"><div class="loading" id="loading">…</div></div>
</div>

<datalist id="school-list"></datalist>
<datalist id="street-list"></datalist>
<datalist id="mayores-list"></datalist>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="__LEAFLET_SRI__" crossorigin="anonymous"></script>
<script>
"use strict";
// ---------------- textos ----------------
const TXT = {
  subtitle: "Madrid · el camino con más sombra y menos riesgo, calle a calle", modeAria: "Modo",
  tabCole: "Al cole", tabLento: "Paso lento", tabAyto: "Ayuntamiento", dayLabel: "Día", prioLabel: "Prioridad", hourLabel: "Hora",
  dates: ["15 jun", "15 sep"], datesLong: ["15 de junio", "15 de septiembre"], prios: ["Sombra", "Equilibrio", "Seguridad"],
  helpCole: "Elige el colegio y marca desde dónde salís: toca el mapa, escribe la calle y el número o usa tu ubicación. La línea morada busca sombra y evita los cruces peligrosos; la de puntos es la más corta.",
  schoolField: "Colegio", schoolPh: "Nombre del colegio o escuela infantil", fromCole: "Salís desde", streetPh: "Calle", streetAria: "Calle de salida", numPh: "Nº", numAria: "Número", here: "Desde aquí",
  helpLento: "Para ir con calma: la ruta busca sombra, evita los cruces peligrosos y pasa junto a bancos, fuentes de beber y aseos públicos. Marca la salida y la llegada tocando el mapa, o escríbelas.",
  fromLento: "Desde", toMayores: "Hasta un centro de mayores", mayoresPh: "Nombre del centro (o toca el mapa)", reset: "Empezar de nuevo",
  tAtr: "Atropellos 2022-2025", tFuentes: "Fuentes de beber",
  hPrio: "Colegios donde plantar primero", hDis: "Sombra por distrito", sun: "Sol", methodLink: "Cómo funciona, de dónde salen los datos y cuánto acierta →",
  prioHelp: (y, m) => `Poca sombra en 250 m a la redonda entre las 13 y las 17 h de junio (el 25 % de colegios con menos) y barrio con una renta media por hogar por debajo de la mediana de los barrios de Madrid (${m} €, IGUALA ${y}). Al lado, los atropellos registrados en ese radio.`,
  disHelp: h => `Sombra media a las ${h} h en las aceras de las calles con edificios de cada distrito. Toca uno para verlo en el mapa.`,
  disMeta: (km, iv, m) => `${km} km de calles · índice de vulnerabilidad IGUALA ${iv} (media de Madrid: ${m})`,
  note: 'Ruta fresca · Ferran Sánchez-Margalef, 2026. Origen de los datos: <a href="https://datos.madrid.es/" target="_blank" rel="noopener">Ayuntamiento de Madrid</a> (portal de datos abiertos, noviembre de 2026), Dirección General del Catastro y © personas colaboradoras de <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> (ODbL). La sombra es una estimación: cuenta edificios y árboles, no toldos ni balcones. <a href="../">También en València</a>.',
  loading: "Cargando…", loadErr: "No se han podido cargar los datos", busy: "Cargando calles…", zoomHint: "Acércate para ver la sombra calle a calle",
  loadingArea: "Cargando las calles de la zona…",
  legend: h => `Sombra en la acera a las ${h} h`, sunAlt: e => `sol a ${e}° de altura`,
  pickSchool: "Elige un colegio para empezar.", firstSchool: "Primero elige un colegio.", markFrom: "Ahora marca desde dónde salís.",
  around: (p, h) => `En los 250 m alrededor del colegio hay un ${p} % de sombra a las ${h} h.`,
  outside: "Ese punto queda fuera de la red de calles de Madrid.", same: "La salida y la llegada están prácticamente en el mismo sitio.", noPath: "No encuentro un camino a pie entre esos dos puntos.",
  gainShade: (a, b) => `la sombra pasa del ${a} % al ${b} %`, gainCross: n => `evitas ${n === 1 ? "un cruce" : n + " cruces"} sin semáforo`,
  gainAtr: n => n === 1 ? "te apartas de un punto donde hubo un atropello" : `te apartas de puntos donde hubo ${n} atropellos`,
  withMore: (m, g) => `Con ${m} m más, ${g}.`, sameLen: g => `${g}, sin alargar el camino.`, alreadyBest: p => `Aquí la ruta más corta ya es la mejor: ${p} % de sombra.`,
  inExchange: c => ` A cambio, ${c}.`, costShade: (a, b) => `algo menos de sombra (${a} % frente a ${b} %)`, costCross: n => `${n === 1 ? "un cruce" : n + " cruces"} más sin semáforo`, and: " y ",
  fresh: "Ruta fresca", short: "La más corta", slow: "Paso lento", inShade: "a la sombra",
  safeLine: (c, a) => `${c === 1 ? "1 cruce" : c + " cruces"} sin semáforo · ${a === 1 ? "1 atropello" : a + " atropellos"}`,
  helpColeRes: (h, a, b) => `A las ${h} h, minutos a paso infantil (4 km/h). Al sol: ${a} m por la ruta fresca y ${b} m por la más corta. Abajo, cruces de calles con tráfico y atropellos registrados en 2022-2025 en cada recorrido.`,
  markHere: "Toca el mapa para marcar dónde estás.", markTo: "Ahora toca adónde vas, o elige un centro de mayores.",
  slowHead: (p, g) => `${p} % a la sombra y nunca más de ${g} m sin un banco, una fuente o un aseo.`, slowNoRest: p => `${p} % a la sombra, aunque sin bancos ni fuentes por el camino.`,
  stops: (b, f, a) => [`${b === 1 ? "1 banco" : b + " bancos"}`, `${f === 1 ? "1 fuente" : f + " fuentes"}`, `${a === 1 ? "1 aseo" : a + " aseos"}`],
  slowHelp: (g, gap, h) => `${g ? g + " respecto a la más corta. " : ""}Por la más corta, el tramo más largo sin dónde parar es de ${gap} m. Minutos a 3 km/h, a las ${h} h.`,
  popShade: (h, p, q) => `Sombra en 250 m a las ${h} h: <b>${p} %</b> (de 13 a 17 h en junio: ${q} %)`, popAtr: m => `Atropellos 2022-2025 a menos de 250 m: ${m}`,

    $("kpis").innerHTML = `
      <div class="kpi"><b>${on ? fmt1(ps.stats1.sombra_hora[d][h]) : st.sombra_hora[d][h]} %</b><span>${on ? t.kpi1p(Hh, fmt1(PL.base1.sombra_hora[d][h])) : t.kpi1(Hh)}</span></div>
      <div class="kpi"><b>${on ? fmt1(ps.stats1.sin_sombra_hora[d][h]) : st.sin_sombra_hora[d][h]} %</b><span>${on ? t.kpi2p(Hh, fmt1(PL.base1.sin_sombra_hora[d][h])) : t.kpi2(Hh)}</span></div>
      <div class="kpi"><b>${prio.length}</b><span>${t.kpi3}</span></div>
      <div class="kpi"><b>${fmt(st.cruces_sin_semaforo)}</b><span>${t.kpi4}</span></div>`;
    const dv = SC.dstats.map(x => x.sombra_hora[d][h]), vHi = Math.max(...dv), vLo = Math.min(...dv);
    const dNames = v => joinList(SC.dstats.filter(x => x.sombra_hora[d][h] === v).map(x => x.n));
    $("ayto-lead").textContent = t.lead(Hh, st.sombra_edif_hora[d][h], st.sombra_hora[d][h], vHi, dNames(vHi), vLo, dNames(vLo), fmt(st.atropellos_red), fmt(st.atropellos));
    $("prio-help").textContent = t.prioHelp(SC.renta_year, fmt(SC.renta_med));
    const shown = prioAll ? prio : prio.slice(0, 25);
    $("prio-list").innerHTML = shown.map(s => `<button class="row" type="button" data-s="${s.i}"><span class="nm">${esc(s.label)}</span><span class="meta">${esc(s.barrio || "")}<span class="pill baja">${esc(t.rentaPill)}</span> · ${esc(s.t.toLowerCase())} · ${esc(t.prioMeta(s.atr))}</span><span class="pct">${on ? s.shh + " → " + ps.sc_shh[s.i] : s.shh} %</span></button>`).join("");
    const mb = $("prio-more"); mb.classList.toggle("hidden", prio.length <= 25); mb.textContent = prioAll ? t.lessBtn : t.moreBtn(prio.length);
    $("dis-help").textContent = t.disHelp(Hh);
    const ds = SC.dstats.slice().sort((x, y) => x.sombra_hora[d][h] - y.sombra_hora[d][h]);
    $("dis-list").innerHTML = ds.map(x => `<button class="row" type="button" data-d="${x.cod}"><span class="nm">${esc(x.n)}</span><span class="meta">${esc(t.disMeta(fmt(x.km), fmt1(SC.ivta[x.n] ?? 0), fmt1(SC.ivta_med)))}</span><span class="pct">${x.sombra_hora[d][h]} %</span></button>`).join("");
    renderPlant();
  }
  function renderPlant(){
    const t = T(), box = $("plant-gain");
    $("plant-seg").innerHTML = t.plantOpts.map((o, i) => `<button type="button" data-pl="${i}" aria-pressed="${i === state.plant}">${esc(o)}</button>`).join("");
    if(!state.plant || !PL){
      $("plant-help").textContent = state.plant ? t.plantLoading : (PL ? t.plantIntro(fmt(PL.n_plan), fmt(PL.n_zv), fmt(PL.near_prio), fmt(PL.n_prio)) : t.plantIntro(fmt(SC.plan.n_plan), fmt(SC.plan.n_zv), fmt(SC.plan.near_prio), fmt(SC.plan.n_prio)));
      box.classList.add("hidden"); return;
    }
    const ps = PS(), d = state.di, h = state.hi, gain = i => ps.sc_shh[i] - schools[i].shh;
    $("plant-help").textContent = t.plantRes[state.plant - 1](fmt(ps.trees.length), H(), fmt1(PL.base1.sombra_hora[d][h]), fmt1(ps.stats1.sombra_hora[d][h]), fmt1(ps.acera_km), fmt1(ps.prio_gain), fmt1(2 * ps.r_med), fmt(ps.h_med), PL.n_prio);
    const top = schools.map(s => s.i).filter(i => gain(i) > 0).sort((x, y) => gain(y) - gain(x) || schools[x].shh - schools[y].shh).slice(0, 8);
    $("gain-list").innerHTML = top.map(i => { const s = schools[i]; return `<button class="row" type="button" data-s="${i}"><span class="nm">${esc(s.label)}</span><span class="meta">${esc(s.barrio || "")} · ${esc(t.gainMeta(ps.ntr[i]))}</span><span class="pct">${s.shh} → ${ps.sc_shh[i]} %</span></button>`; }).join("");
    box.classList.remove("hidden");
  }
  $("plant-seg").addEventListener("click", e => {
    const b = e.target.closest("[data-pl]"); if(!b) return;
    state.plant = +b.dataset.pl;
    if(state.plant && !PL){ renderPlant(); loadPlant().then(() => refresh()).catch(err => { console.error(err); state.plant = 0; renderPlant(); $("plant-help").textContent = T().plantErr; }); return; }
    refresh();
  });
  const goSchool = e => { const b = e.target.closest("[data-s]"); if(!b) return; const s = schools[+b.dataset.s]; map.setView([s.lat, s.lon], 16); schoolMarkers[s.i].openPopup(); };
  $("gain-list").addEventListener("click", goSchool); $("prio-list").addEventListener("click", goSchool);
  $("prio-more").addEventListener("click", () => { prioAll = !prioAll; renderAyto(); });
  $("dis-list").addEventListener("click", e => { const b = e.target.closest("[data-d]"); if(!b) return; const x = SC.dstats.find(q => q.cod === +b.dataset.d); map.fitBounds([[x.bb[0], x.bb[1]], [x.bb[2], x.bb[3]]], {padding: [20, 20]}); });
  const toggle = (id, layer) => $(id).addEventListener("change", e => { if(state.mode === "ayto") e.target.checked ? layer.addTo(map) : layer.remove(); });
  toggle("t-atr", atrLayer); toggle("t-fuentes", fuentesLayer);

  // ---------- controles: fecha, hora, prioridad ----------
  function drawControls(){
    const t = T();
    $("dates").innerHTML = t.dates.map((d, i) => `<button type="button" data-d="${i}" aria-pressed="${i === state.di}">${esc(d)}</button>`).join("");
    $("prio").innerHTML = t.prios.map((p, i) => `<button type="button" data-p="${i}" aria-pressed="${i === state.prio}">${esc(p)}</button>`).join("");
    $("hours").innerHTML = HOURS.map((h, i) => `<button type="button" data-h="${i}" aria-pressed="${i === state.hi}">${h} h</button>`).join("");
    $("hour-sun").textContent = t.datesLong[state.di] + " · " + t.sunAlt(IX.sun[K()][1]);
    $("legend-title").textContent = t.legend(H());
  }
  function refresh(){
    drawControls();
    recolorSchools(); drawTrees();
    renderAyto();
    if(state.mode === "cole") renderCole(false); else if(state.mode === "lento") renderLento(false); else shade.redraw();
  }
  $("dates").addEventListener("click", e => { const b = e.target.closest("[data-d]"); if(b){ state.di = +b.dataset.d; refresh(); } });
  $("hours").addEventListener("click", e => { const b = e.target.closest("[data-h]"); if(b){ state.hi = +b.dataset.h; refresh(); } });
  $("prio").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if(b){ state.prio = +b.dataset.p; refresh(); } });

  // ---------- pestañas y toques en el mapa ----------
  function setMode(m, fit){
    state.mode = m;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.mode === m)));
    ["cole", "lento", "ayto"].forEach(x => $("mode-" + x).classList.toggle("hidden", x !== m));
    map.closePopup(); routeLayer.clearLayers(); [restLayer, mayLayer, prioLayer, atrLayer, fuentesLayer, plantLayer].forEach(l => l.remove()); shade.dim = false;
    recolorSchools(); drawTrees();
    if(m === "cole") renderCole(fit);
    if(m === "lento"){ mayLayer.addTo(map); renderLento(fit); }
    if(m === "ayto"){
      prioLayer.addTo(map); plantLayer.addTo(map);
      [["t-atr", atrLayer], ["t-fuentes", fuentesLayer]].forEach(([id, l]) => { if($(id).checked) l.addTo(map); });
      renderAyto(); if(fit) map.setView(CENTER, 12); shade.redraw();
    }
  }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode, true)));
  map.on("click", e => {
    const ll = [e.latlng.lat, e.latlng.lng];
    if(state.mode === "cole"){
      if(state.school == null){ $("cole-result").innerHTML = `<p class="headline">${T().firstSchool}</p>`; return; }
      state.origin = ll; $("street-cole").value = ""; $("num-cole").value = ""; renderCole(true);
    } else if(state.mode === "lento"){
      const s0 = state.lento;
      if(s0.a && s0.b){ state.lento = {a: ll, b: null}; $("mayores-input").value = ""; }
      else if(!s0.a) state.lento = {a: ll, b: s0.b};
      else state.lento = {a: s0.a, b: {ll}};
      $("street-lento").value = ""; $("num-lento").value = ""; renderLento(!!state.lento.b);
    }
  });

  // ---------- colores al cambiar de tema ----------
  function recolor(){
    schoolMarkers.forEach((mk, i) => mk.setStyle({color: cssVar("--ink"), fillColor: bucketCol(sSh(schools[i]))}));
    atrLayer.eachLayer(l => l.setStyle({color: cssVar("--panel"), fillColor: cssVar("--atr")}));
    fuentesLayer.eachLayer(l => l.setStyle({color: cssVar("--panel"), fillColor: cssVar("--cold")}));
    mayLayer.eachLayer(l => l.setStyle({color: cssVar("--rest"), fillColor: cssVar("--panel")}));
    prioLayer.eachLayer(l => l.setStyle({color: cssVar("--s0")}));
    treeKey = ""; drawTrees();
    if(state.mode === "cole") renderCole(false); else if(state.mode === "lento") renderLento(false); else shade.redraw();
  }
  const mq = window.matchMedia("(prefers-color-scheme: dark)"); if(mq.addEventListener) mq.addEventListener("change", recolor);
  new MutationObserver(recolor).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

  // ---------- ejemplos reales al abrir (15 de junio, 13 h) ----------
  const D = SC.demo || {};
  const ex = D.cole && schools.find(s => s.n === D.cole.n && Math.abs(s.lat - D.cole.lat) < 1e-5);
  if(ex){ state.school = ex.i; state.origin = D.cole.o; $("school-input").value = ex.label; }
  const exM = D.lento && mayores.find(m => m.n === D.lento.n);
  if(exM){ state.lento = {a: D.lento.o, b: {ll: [exM.lat, exM.lon], label: exM.label}}; $("mayores-input").value = exM.label; }
  drawControls(); renderAyto();
  setMode("cole", true);
  if(/[?&]debug=1/.test(location.search)) window.__rf = {schools, mayores, nearestNode, route, restAlong, state, plant: () => PL, curSH, ensure, ensureAround, tilesIn, adj, TILES, names, pair: (a, b, m) => pair(a, b, m, document.createElement("div"))};
}
// instalación en el móvil y uso sin conexión: solo cuando la web se abre directamente, no dentro de otra página
if("serviceWorker" in navigator && window.top === window && (location.protocol === "https:" || location.hostname === "localhost"))
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
